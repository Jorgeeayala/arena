<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ekuatia Login</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  width: 340px;
  background: #f8fafc;
}

.container { padding: 16px; }

.logo {
  width: 140px;
  display: block;
  margin: 0 auto 10px;
}

h3 {
  text-align: center;
  margin: 8px 0;
}

#search {
  width: 100%;
  padding: 10px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  outline: none;
}

#results {
  border: 1px solid #e2e8f0;
  border-top: none;
  max-height: 180px;
  overflow-y: auto;
  background: white;
  border-radius: 0 0 8px 8px;
}

.result-item {
  padding: 10px;
  cursor: pointer;
  border-bottom: 1px solid #f1f5f9;
  transition: background 0.2s;
}

.result-item:hover {
  background: #e0f2fe;
}

.input-group {
  margin-top: 10px;
}

label {
  font-size: 12px;
  font-weight: bold;
  color: #334155;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 4px;
  border-radius: 8px;
  border: 1px solid #cbd5e1;
  outline: none;
}

button {
  width: 100%;
  padding: 11px;
  margin-top: 12px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: 0.95;
}

.file-box {
  margin-bottom: 10px;
}

</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <img src="logo.png" class="logo">

  <h3>Ekuatia Login</h3>

  <!-- IMPORT CSV -->
  <div class="file-box">
    <input type="file" id="fileInput" accept=".csv">
  </div>

  <!-- SEARCH -->
  <input id="search" placeholder="Buscar por nombre o RUC">

  <!-- RESULTS -->
  <div id="results"></div>

  <!-- USER -->
  <div class="input-group">
    <label>Usuario (RUC)</label>
    <input id="user">
  </div>

  <!-- PASS -->
  <div class="input-group">
    <label>Contraseña</label>
    <input id="pass" type="password">
  </div>

  <!-- BUTTON -->
  <button id="autoLogin">Login automático</button>

</div>

<script src="popup.js"></script>

</body>
</html>
